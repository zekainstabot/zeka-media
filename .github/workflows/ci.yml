name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://zeka:zeka@127.0.0.1:5432/zeka
      TELEGRAM_BOT_TOKEN: "000000000:build-check-placeholder"
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: "zeka_bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Next.js application
        run: npm run build
